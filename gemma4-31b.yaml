# Pre-requisite: Create the HF_TOKEN secret before applying this file
# Use the protected stdin workflow: make deploy-vllm--gemma-4-31b
# Never place token values in command arguments or committed files.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma4-31b-hf-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: standard
  volumeMode: Filesystem
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-31b-vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma4-31b-vllm
  template:
    metadata:
      labels:
        app: gemma4-31b-vllm
        model: gemma4-31b-it-nvfp4
        engine: vllm
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      runtimeClassName: nvidia
      containers:
        - name: gemma4-31b-vllm
          # vllm/vllm-openai:gemma4-cu130 ARM64 manifest verified 2026-10-23.
          image: docker.io/vllm/vllm-openai@sha256:2970dd3c8fd00bccbc663345f9b4d87b35c491f4b13a2a4cdef60fe5c015f6e2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Root and writable rootfs remain unverified legacy GPU-image exceptions.
            # Validate cache/runtime paths before enforcing non-root/read-only.
          ports:
            - containerPort: 8000
          args:
            [
              "nvidia/Gemma-4-31B-IT-NVFP4",
              "--max-model-len",
              "262144",
              "--served-model-name",
              "gemma",
              "--enable-auto-tool-choice",
              "--tool-call-parser",
              "gemma4",
              "--reasoning-parser",
              "gemma4",
              "--async-scheduling",
              "--gpu-memory-utilization",
              "0.75",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
            ]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "hf-secret"
                  key: "HF_TOKEN"
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: 16
              memory: 128Gi
            requests:
              cpu: 8
              memory: 64Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: hf-cache
          persistentVolumeClaim:
            claimName: gemma4-31b-hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-31b-vllm
spec:
  selector:
    app: gemma4-31b-vllm
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
