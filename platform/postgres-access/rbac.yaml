apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-forwarder
  namespace: postgres-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-forwarder
  namespace: postgres-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["postgres"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    # WebSocket GET plus the Kubernetes 1.35 synthetic CREATE authorization check.
    # https://www.kubernetes.dev/resources/keps/4006/
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-forwarder
  namespace: postgres-dev
subjects:
  - kind: ServiceAccount
    name: postgres-forwarder
    namespace: postgres-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-forwarder
