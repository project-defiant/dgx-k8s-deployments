apiVersion: v1
kind: ResourceQuota
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 104Gi
    requests.nvidia.com/gpu: "1"
    persistentvolumeclaims: "2"
    requests.storage: 420Gi
    pods: "2"
