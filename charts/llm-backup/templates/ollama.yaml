apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: ollama
spec:
  replicas: {{ .Values.ollama.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      runtimeClassName: {{ .Values.ollama.runtimeClass }}
      containers:
        - name: ollama
          image: {{ printf "%s@%s" .Values.ollama.image.repository .Values.ollama.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/.ollama/models
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data/.ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
