apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TMPDIR
              value: /tmp
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /var/lib/gitea/data/forgejo.db
            - name: FORGEJO__server__APP_DATA_PATH
              value: /var/lib/gitea/data
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__ROOT_URL
              value: {{ .Values.rootURL | quote }}
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
            - name: FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: {{ .Values.trustedProxyCIDR | quote }}
            - name: FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION
              value: "false"
            - name: FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION
              value: "false"
            - name: FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER
              value: ""
            - name: FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_EMAIL
              value: ""
            - name: FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME
              value: ""
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "false"
            - name: FORGEJO__packages__ENABLED
              value: "false"
            # INSTALL_LOCK is deliberately NOT forced from environment: the private
            # wizard writes true to persisted app.ini after the first admin setup.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
