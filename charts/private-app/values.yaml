image:
  repository: ""
  digest: ""
command: []
args: []
containerPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
probes:
  path: /
  initialDelaySeconds: 2
  periodSeconds: 5
config:
  mountPath: /www
  files: {}
persistence:
  enabled: false
  size: 1Gi
  mountPath: /data
  storageClass: local-path
writableTmp: false
quota:
  enabled: false
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    persistentvolumeclaims: "4"
    requests.storage: 10Gi
    pods: "8"
# Enable to restrict ingress and allow DNS plus explicitly named backend pods.
networkPolicy:
  enabled: false
  egressBackends: []
